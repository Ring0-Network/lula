[package]
name = "lula1"
version = "0.1.0"
edition = "2021"
description = "LULA I deterministic hash-based signing with honest-cache equivalence; conditional rollback-security transfer"

[dependencies]
sha2 = { version = "=0.10.9", features = ["compress"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
debug = false
